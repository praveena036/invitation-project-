{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Cherish By Wed Knot Craft</title>

    <link
        rel="stylesheet"
        href="{% static 'home/css/style.css' %}"
    >

</head>


<body class="inner-page">


<header class="inner-header">

    <a href="{% url 'home' %}">

        <img
            src="/media/images/plant_theme.png"
            alt="Wedding Card"
        >

    </a>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-switch">

            <button
                type="button"
                class="auth-tab active"
                id="loginTab"
            >
                Login
            </button>

            <button
                type="button"
                class="auth-tab"
                id="signupTab"
            >
                Sign Up
            </button>

        </div>


        <div id="loginForm">

            <h1>
                Login
            </h1>

            <p class="auth-subtitle">
                Login to my Account
            </p>


            <form>

                <label>
                    Email
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >


                <a
                    href="#"
                    class="forgot-link"
                >
                    Forgot Password?
                </a>


                <button
                    type="submit"
                    class="auth-submit"
                >
                    Login &amp; Continue
                </button>

            </form>

        </div>


        <div
            id="signupForm"
            class="hidden-form"
        >

            <h1>
                Create Account
            </h1>

            <p class="auth-subtitle">
                Create your Wedding Card account
            </p>


            <form>

                <label>
                    Name
                </label>

                <input
                    type="text"
                    placeholder="Enter your name"
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Create password"
                >


                <button
                    type="submit"
                    class="auth-submit"
                >
                    Create Account
                </button>

            </form>

        </div>


        <a
            href="{% url 'home' %}"
            class="back-home"
        >
            ← Back to Home
        </a>

    </div>

</main>


<script>

    const loginTab =
        document.getElementById("loginTab");

    const signupTab =
        document.getElementById("signupTab");

    const loginForm =
        document.getElementById("loginForm");

    const signupForm =
        document.getElementById("signupForm");


    signupTab.addEventListener(
        "click",
        function () {

            loginTab.classList.remove("active");

            signupTab.classList.add("active");

            loginForm.classList.add("hidden-form");

            signupForm.classList.remove("hidden-form");

        }
    );


    loginTab.addEventListener(
        "click",
        function () {

            signupTab.classList.remove("active");

            loginTab.classList.add("active");

            signupForm.classList.add("hidden-form");

            loginForm.classList.remove("hidden-form");

        }
    );

</script>


</body>

</html>
